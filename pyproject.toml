[project]
name = "expenses"
version = "0.9.0"
description = "A lightweight, mobile-first expense tracker"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "apscheduler>=3.10.4",
    "pydantic>=2.7.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "tzdata>=2024.1",
    "weasyprint>=69.0",
    "rapidfuzz>=3.14.3",
    "regex>=2026.5.9",
    "psutil>=6.1.0",
    "pydantic-ai-slim[anthropic,openai]>=2.56.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "pillow>=13.0.0",
    "pyjwt[crypto]>=2.10.1",
    "cryptography>=46.0.0",
]

[project.scripts]
dev = "expenses.cli.dev:main"
export-ios-fixtures = "expenses.cli.export_ios_fixtures:main"
run-ios-device = "expenses.cli.run_ios_device:main"
export-openapi = "expenses.cli.export_openapi:main"
forecast-backtest = "expenses.cli.forecast_backtest:main"
migrations = "expenses.cli.migrations:main"
fast-tests = "expenses.cli.test:fast_tests"
full-tests = "expenses.cli.test:full_tests"
mock-db = "expenses.cli.mock_db:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.17",
    "pip-audit>=2.10.1",
    "pytest>=9.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.1.0",
    "ty==0.0.107",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-select = [
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C901",
    "DTZ005",
    "DTZ011",
    "ERA",
    "FAST001",
    "FAST003",
    "I",
    "PGH",
    "PIE",
    "PLE",
    "PLR1711",
    "PLR1714",
    "PLR1730",
    "PLR5501",
    "PT",
    "RET",
    "RUF006",
    "RUF012",
    "RUF015",
    "RUF100",
    "S110",
    "S112",
    "S608",
    "SIM",
    "T20",
    "TRY203",
    "TRY401",
]
# FastAPI declares dependencies as calls in default arguments. Services set
# hydrated attributes that the ORM models do not declare.
# SIM102 would merge parallel guard branches into uneven conditions.
ignore = ["B008", "B010", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"src/expenses/cli/**" = ["T20"]
"tests/**" = ["ARG", "ASYNC110", "DTZ005", "DTZ011", "S608"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ty.environment]
# Match CI so the baseline reads the same on every machine.
python-version = "3.12"
python-platform = "linux"

[tool.ty.src]
include = ["src"]

[tool.importlinter]
root_package = "expenses"

[[tool.importlinter.contracts]]
name = "Backend layers"
type = "layers"
layers = [
    "expenses.cli",
    "expenses.app",
    "expenses.api",
    "expenses.services",
    "expenses.db",
    "expenses.core",
]
