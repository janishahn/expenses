name: Full tests

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the Linux visual baselines and upload them instead of running the suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-tests:
    name: Full desktop, mobile, and cross-browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ui

      - name: Run full test suite
        if: ${{ !inputs.update_snapshots }}
        run: uv run full-tests

      - name: Build the web app
        if: ${{ inputs.update_snapshots }}
        run: npm run build --prefix ui

      - name: Regenerate Linux visual baselines
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test tests/visual.spec.ts tests/visual.mobile.spec.ts --project=desktop-chromium --project=mobile-webkit --update-snapshots=all
        working-directory: ui

      - name: Upload Linux visual baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: ui/tests/*-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7
