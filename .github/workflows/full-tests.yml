name: Full tests

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the Linux visual baselines and upload them instead of running the suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

# The Fast tests workflow already runs the fast gate on every pull request, so
# this workflow only builds the web app and runs the browser suite.
jobs:
  full-tests:
    name: Browser suite (shard ${{ matrix.shard }}/4)
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the browser suite
        uses: ./.github/actions/setup-browser-suite

      - name: Run browser suite shard
        run: npx playwright test --shard=${{ matrix.shard }}/4
        working-directory: ui

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ matrix.shard }}
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  update-snapshots:
    name: Regenerate Linux visual baselines
    if: ${{ inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the browser suite
        uses: ./.github/actions/setup-browser-suite

      - name: Regenerate Linux visual baselines
        run: npx playwright test tests/visual.spec.ts tests/visual.mobile.spec.ts --project=desktop-chromium --project=mobile-webkit --update-snapshots=all
        working-directory: ui

      - name: Upload Linux visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: ui/tests/*-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7
