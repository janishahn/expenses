name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPENSES_DATA_DIR: ${{ github.workspace }}/.ci-data

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Audit UI dependencies
        run: npm audit --prefix ui --audit-level=high

      - name: Apply database migrations
        run: |
          mkdir -p "$EXPENSES_DATA_DIR"
          uv run python -m alembic upgrade head

      - name: Run fast test suite
        run: uv run fast-tests

  web-e2e:
    name: Web journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --frozen --group dev
      - run: npm ci --prefix ui
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ui
      - name: Build and exercise web journeys
        run: |
          npm --prefix ui run build
          npm --prefix ui run test:e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  ios-e2e:
    name: Native journeys
    uses: ./.github/workflows/ios-e2e.yml
