name: iOS E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: iPhone simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install PDF runtime libraries
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - run: uv sync --frozen --group dev
      - name: Exercise native journeys
        run: uv run ios-e2e
      - name: Upload simulator diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-diagnostics
          path: test-results/ios
          if-no-files-found: ignore
          retention-days: 7
