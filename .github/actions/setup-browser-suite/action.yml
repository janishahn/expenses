name: Set up the browser suite
description: Install dependencies and Playwright browsers, then build the web app.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install Python dependencies
      shell: bash
      run: uv sync --frozen --group dev

    - name: Install UI dependencies
      shell: bash
      run: npm ci --prefix ui

    - name: Read Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('./ui/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: browser-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Playwright browsers
      if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: ui
      run: npx playwright install --with-deps chromium firefox webkit

    - name: Install Playwright system dependencies
      if: ${{ steps.browser-cache.outputs.cache-hit == 'true' }}
      shell: bash
      working-directory: ui
      run: npx playwright install-deps chromium firefox webkit

    - name: Build the web app
      shell: bash
      run: npm run build --prefix ui
